name: Build Android APK & AAB (Release)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Test & Build Flutter Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze

      - name: Run Automated Unit & Widget Tests
        run: flutter test

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split per ABI Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle (AAB for Google Play / Stores)
        run: flutter build appbundle --release

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shamsi-Reminder-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload Split APKs (arm64-v8a, armeabi-v7a)
        uses: actions/upload-artifact@v4
        with:
          name: Shamsi-Reminder-Split-APKs
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: Upload Release App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: Shamsi-Reminder-Release-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
